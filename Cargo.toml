[package]
name = "desert-ui"
version = "0.1.0"
edition = "2024"
description = "Shared native GPUI application components extracted from Picacho and Ironwood"
license = "MIT"

[dependencies]
gpui = "=0.2.2"
gpui-component = "=0.5.1"

[dev-dependencies]
gpui = { version = "=0.2.2", features = ["test-support"] }

[profile.dev]
debug = 0

[target.'cfg(target_os = "macos")'.dependencies]
# Compile the same Metal shaders at runtime; no separate Xcode Metal download.
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }
