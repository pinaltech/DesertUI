[package]
name = "desert-ui"
version = "0.2.0"
edition = "2024"
description = "Shared native GPUI application components extracted from Picacho and Ironwood"
license = "MIT"

[dependencies]
# GPUI from the gpui-pre snapshots of Zed, as Picacho uses: its platforms are
# separate crates, and it runs in the browser too (WebGPU). gpui-component
# 0.9.1 pins gpui-pre =0.3.12.
gpui = { package = "gpui-pre", version = "=0.3.12", default-features = false }
gpui-component = "=0.9.1"
gpui-component-assets = { package = "gpui-kit-assets", version = "=0.9.1" }

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.12", features = ["test-support"] }
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["font-kit", "wayland", "x11", "runtime_shaders"] }

[profile.dev]
debug = 0

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"
raw-window-handle = "0.6"

[lints.rust]
# objc 0.2's selector macros still probe this legacy feature.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }
